<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, 'Nirmala UI', 'Noto Sans Devanagari', 'Mukta', sans-serif; font-size: 26px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .axis-label { font-family: system-ui, 'Nirmala UI', 'Noto Sans Devanagari', 'Mukta', sans-serif; font-size: 17px; font-weight: bold; fill: #111111; }
      .curve-label { font-family: system-ui, 'Nirmala UI', 'Noto Sans Devanagari', 'Mukta', sans-serif; font-size: 15px; font-weight: bold; }
      .point-label { font-family: system-ui, 'Nirmala UI', 'Noto Sans Devanagari', 'Mukta', sans-serif; font-size: 16px; font-weight: bold; fill: #b71c1c; }
      .axis-tick { font-family: system-ui, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif; font-size: 16px; font-weight: bold; fill: #333333; }
      .arrow { fill: #111111; }
    </style>
    <marker id="arrowX" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#111111"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="3" refY="6" orient="auto">
      <path d="M0,8 L6,8 L3,0 z" fill="#111111"/>
    </marker>
    <marker id="pointer" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#b71c1c"/>
    </marker>
  </defs>

  <!-- Pure White Solid Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="475" y="45" class="title">सामाजिक कल्याण का निरपेक्ष बिंदु (The Point of Bliss)</text>

  <!-- Axes (Origin at X:130, Y:540) -->
  <!-- Y Axis -->
  <line x1="130" y1="540" x2="130" y2="85" stroke="#111111" stroke-width="2.5" marker-end="url(#arrowY)"/>
  <!-- X Axis -->
  <line x1="130" y1="540" x2="880" y2="540" stroke="#111111" stroke-width="2.5" marker-end="url(#arrowX)"/>

  <!-- Origin Label -->
  <text x="110" y="558" class="axis-tick">O</text>

  <!-- Y-Axis Label (Rotated) -->
  <text x="-310" y="50" transform="rotate(-90)" class="axis-label" text-anchor="middle">
    व्यक्ति B की उपयोगिता (Utility of Individual B - U<tspan baseline-shift="sub" font-size="12">B</tspan>)
  </text>

  <!-- X-Axis Label -->
  <text x="500" y="600" class="axis-label" text-anchor="middle">
    व्यक्ति A की उपयोगिता (Utility of Individual A - U<tspan baseline-shift="sub" font-size="12">A</tspan>)
  </text>

  <!-- Grand Utility Possibility Frontier (GUPF): Smooth concave downward-sloping curve -->
  <!-- Starts near (130, 130) and ends near (820, 540) -->
  <path d="M 130 140 Q 420 180, 810 540" fill="none" stroke="#0d47a1" stroke-width="3.5"/>
  <text x="815" y="525" class="curve-label" fill="#0d47a1">GUPF</text>

  <!-- Family of Social Indifference Curves (SIC) - Convex to origin -->
  <!-- SIC 1 (Lower social welfare) -->
  <path d="M 330 130 Q 385 270, 570 395" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="575" y="405" class="curve-label" fill="#2e7d32">SIC₁</text>

  <!-- SIC 2 (Tangent to GUPF at Point B: ~ X:490, Y:270) -->
  <path d="M 380 110 Q 455 240, 715 390" fill="none" stroke="#1b5e20" stroke-width="3.5"/>
  <text x="725" y="395" class="curve-label" fill="#1b5e20">SIC₂</text>

  <!-- SIC 3 (Higher, unattainable social welfare level) -->
  <path d="M 465 110 Q 550 215, 830 350" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="838" y="355" class="curve-label" fill="#2e7d32">SIC₃</text>

  <!-- Bliss Point Coordinates: X=490, Y=270 -->
  <!-- Dashed Reference Lines to Axes -->
  <line x1="490" y1="270" x2="490" y2="540" stroke="#777777" stroke-width="1.8" stroke-dasharray="5,5"/>
  <line x1="130" y1="270" x2="490" y2="270" stroke="#777777" stroke-width="1.8" stroke-dasharray="5,5"/>

  <!-- Axis Reference Values -->
  <text x="490" y="565" class="axis-tick" text-anchor="middle">U<tspan baseline-shift="sub" font-size="12">A</tspan>*</text>
  <text x="95" y="275" class="axis-tick" text-anchor="middle">U<tspan baseline-shift="sub" font-size="12">B</tspan>*</text>

  <!-- Point B Marker -->
  <circle cx="490" cy="270" r="6.5" fill="#111111"/>

  <!-- Point B Label and Annotation -->
  <text x="465" y="255" class="axis-tick" font-size="19" fill="#111111">B</text>
  
  <line x1="570" y1="190" x2="502" y2="258" stroke="#b71c1c" stroke-width="2" marker-end="url(#pointer)"/>
  <text x="580" y="180" class="point-label">आनंद/निरपेक्ष बिंदु (Point of Bliss)</text>
  <text x="580" y="202" font-family="system-ui, 'Nirmala UI', sans-serif" font-size="14" font-weight="bold" fill="#333333">
    (स्पर्श स्थिति: MRS<tspan baseline-shift="sub" font-size="10">W</tspan> = MRPT)
  </text>
</svg>
